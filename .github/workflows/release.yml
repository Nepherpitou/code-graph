name: Release

# A release is cut by pushing a tag that points to a commit on master:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The tag must match the version in Cargo.toml. Assets are static Linux binaries
# (musl) and native macOS binaries, each with its own sha256 and one shared
# SHA256SUMS file.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag points to master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "tag $GITHUB_REF_NAME does not point to a commit on master" >&2
            exit 1
          }

      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binaries for servers. Both cross-build with zig's cc: the
          # bundled SQLite needs a compiler cc-rs can find, and Debian's
          # musl-tools ships only `musl-gcc`, not the `x86_64-linux-musl-gcc`
          # cc-rs looks for.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linker: zig
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            linker: zig
          # macOS 14 runners were retired in November 2026. Build each
          # architecture on its own image: macos-15 is arm64, macos-15-intel
          # is x86_64.
          - target: aarch64-apple-darwin
            os: macos-15
            linker: native
          - target: x86_64-apple-darwin
            os: macos-15-intel
            linker: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.linker == 'zig'
        run: |
          python3 -m pip install --user ziglang
          cargo install --locked cargo-zigbuild

      - name: Build
        run: |
          if [ "${{ matrix.linker }}" = "zig" ]; then
            cargo zigbuild --profile dist --locked --target ${{ matrix.target }}
          else
            cargo build --profile dist --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          name="code-graph-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/dist/code-graph" "$name"
          chmod +x "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          echo "ASSET=$name" >> "$GITHUB_ENV"
          cat "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/code-graph-* \
            dist/SHA256SUMS
