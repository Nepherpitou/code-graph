name: code-graph rust report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-graph-rust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CG: ./vendor/code-graph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify vendored binary
        run: |
          test -x "$CG" || {
            echo "vendor/code-graph is missing or not executable. Rebuild it on a baseline CPU:" >&2
            echo "  docker run --rm -v \"\$PWD\":/src -w /src -v /tmp/cg-target:/tmp/cg-target -e CARGO_TARGET_DIR=/tmp/cg-target docker.io/library/rust:1-alpine cargo build --profile dist --locked --target x86_64-unknown-linux-musl" >&2
            exit 1
          }
          (cd vendor && sha256sum -c code-graph.sha256)
          ldd "$CG" 2>&1 | grep -Eq 'statically linked|not a dynamic executable' \
            || { echo 'vendor/code-graph is not statically linked' >&2; exit 1; }
          "$CG" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - name: Baseline worktree and changed files
        run: |
          TMP="$RUNNER_TEMP"
          base_ref="${{ github.base_ref }}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          base=$(git merge-base "origin/$base_ref" HEAD)
          git worktree add "$TMP/base" "$base"
          git rev-parse "$base" > "$TMP/base.sha"
          git diff --name-only "$base" HEAD > "$TMP/changed.txt"
          (cd "$TMP/base" && cargo fetch --locked)
          cargo fetch --locked

      - name: Warm dependencies
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          cargo check --locked

      - name: Analyze baseline and head
        run: |
          TMP="$RUNNER_TEMP"
          DB="$RUNNER_TEMP/cg.db"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          "$CG" analyze "$TMP/base" --lang rust --exclude fixtures --db "$DB" --quiet \
            -o "$TMP/base.graph.json"
          "$CG" analyze . --lang rust --exclude fixtures --db "$DB" --quiet \
            -o "$TMP/head.graph.json"

      - name: Build comment
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TMP="$RUNNER_TEMP"
          DB="$TMP/cg.db"
          V="$TMP/views"
          mkdir -p "$V"
          : > "$V/warnings.log"
          if [ -x "$CG" ] && [ -s "$DB" ]; then
            common=(--db "$DB" --changed-files "$TMP/changed.txt" --format json)
            run_view() { local out="$1" view="$2"; shift 2; "$CG" audit diff "${common[@]}" --view "$view" "$@" > "$V/$out" 2>> "$V/warnings.log" || true; }
            "$CG" audit diff "${common[@]}" --view summary > "$V/summary.json" 2>> "$V/warnings.log" || true
            run_view uses.json uses --limit 10
            run_view dependencies.json dependencies --limit 6
            run_view callers.json callers --limit 8
            run_view affected.json affected --limit 8
            run_view similar.json similar --limit 8
            run_view areas.json areas --limit 6
            run_view filtered.json filtered-edges
            run_view silent.json silent-files --limit 1
            run_view dead.json dead-code --limit 1
            "$CG" audit diff "${common[@]}" --view symbols --order-by priority --limit 12 \
              > "$V/review.json" 2>> "$V/warnings.log" || true
            "$CG" audit diff "${common[@]}" --view symbols --order-by priority --limit 80 \
              > "$V/symbols.json" 2>> "$V/warnings.log" || true
            grep -v 'roots differ' "$V/warnings.log" > "$V/warn.filtered" || true
            mv "$V/warn.filtered" "$V/warnings.log"
          fi
          base=$(cat "$TMP/base.sha" 2>/dev/null || true)
          additions=0; deletions=0; files=0
          if [ -n "$base" ]; then
            read -r files additions deletions < <(git diff --numstat "$base" HEAD \
              | awk '$1 ~ /^[0-9]+$/ { a += $1; d += $2; n += 1 } END { print n + 0, a + 0, d + 0 }')
          fi
          rm -f "$TMP/empty-report"
          code=0
          python3 .github/scripts/pr-report.py --dir "$V" \
            --title "$PR_TITLE" \
            --sha "$PR_SHA" \
            --additions "$additions" --deletions "$deletions" --files "$files" \
            > "$TMP/comment.md" || code=$?
          if [ "$code" -eq 3 ]; then
            : > "$TMP/empty-report"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-graph-rust-views
          path: ${{ runner.temp }}/views
          if-no-files-found: ignore

      - name: Publish comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TMP="$RUNNER_TEMP"
          if [ ! -s "$TMP/comment.md" ] && [ ! -f "$TMP/empty-report" ]; then
            echo 'comment was not built' >&2
            exit 0
          fi
          marker='<!-- code-graph-rust-report -->'
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
                | head -n1 || true)
          if [ -f "$TMP/empty-report" ]; then
            echo 'nothing to report'
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" > /dev/null
            fi
            exit 0
          fi
          { echo "$marker"; echo; cat "$TMP/comment.md"; } > "$TMP/comment.body.md"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F "body=@$TMP/comment.body.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F "body=@$TMP/comment.body.md" > /dev/null
          fi
