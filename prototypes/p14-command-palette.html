<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P14 · Command palette — code-graph directions</title>
<link rel="stylesheet" href="assets/proto.css">
<style>
  :root {
    --bg: #090c10;
    --panel: #11161c;
    --panel-2: #182028;
    --line: #283440;
    --line-soft: #1a232c;
    --fg: #ecf2f7;
    --muted: #8493a2;
    --faint: #526171;
    --accent: #7dd3fc;
    --accent-ink: #052431;
    --canvas: #0b1016;
    --edge: #3c4e60;
    --radius-lg: 13px;
  }
  body { overflow: hidden; }
  .app { height: 100vh; display: flex; flex-direction: column; }
  .top { height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 17px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 10px; }
  .crumbs { color: var(--muted); font-size: 10px; }
  .crumbs b { color: var(--fg); font-weight: 500; }
  .top .spacer { flex: 1; }
  .top .btn { height: 26px; font-size: 10px; background: var(--panel-2); border-color: var(--line); }
  .avatar { background: #d2c4b0; color: #3d2f1f; }
  .canvas { flex: 1; min-height: 0; position: relative; background: var(--canvas); }
  .canvas .graph-shell { height: 100%; }
  .graph-toolbar { top: 13px; left: 14px; }
  .graph-legend { color: var(--faint); }
  .minimap { width: 160px; height: 96px; right: 14px; bottom: 14px; }
  .dim { position: absolute; inset: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 64%, transparent); backdrop-filter: blur(2px); }
  .palette-wrap { position: absolute; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding-top: 13vh; }
  .command-palette { position: relative; max-height: 66vh; display: flex; flex-direction: column; }
  .command-input { padding: 14px 16px; }
  .command-input svg { width: 18px; height: 18px; color: var(--muted); }
  .command-input input { font-size: 14.5px; }
  .command-body { overflow: auto; padding-bottom: 6px; }
  .command-group { padding: 7px 7px 4px; }
  .command-item { font-size: 11.5px; padding: 8px; }
  .command-item .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--panel-2); color: var(--accent); font-family: var(--mono); font-size: 8px; flex: 0 0 auto; }
  .command-item .label { min-width: 0; }
  .command-item b { display: block; font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
  .command-item span { display: block; color: var(--faint); font-size: 9px; margin-top: 1px; }
  .command-item .hint { color: var(--faint); font-size: 9px; }
  .palette-foot { display: flex; align-items: center; gap: 10px; padding: 8px 13px; border-top: 1px solid var(--line); color: var(--faint); font-size: 9px; }
  .palette-foot .spacer { flex: 1; }
  .selected-preview { position: absolute; left: 15px; bottom: 15px; z-index: 8; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--muted); font-size: 9px; }
  .selected-preview b { color: var(--fg); font-family: var(--mono); font-weight: 500; }
  .selected-preview .spacer { flex: 1; }
  @media (max-width: 700px) { .palette-wrap { padding-top: 8vh; } .command-palette { width: 94vw; } .graph-toolbar { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="index.html"><span class="brand-mark">◉</span><span>code-graph</span></a>
    <span class="faint">/</span><div class="crumbs">checkout-service <span class="faint">/</span> <b>graph</b> <span class="faint">/</span> command palette</div>
    <span class="spacer"></span><button class="btn sm">⌘ K</button><button class="btn sm">Export</button><span class="avatar">AR</span>
  </header>

  <main class="canvas graph-shell" id="demo-graph">
    <div class="graph-toolbar"><button>−</button><button>+</button><button>⌖</button><span class="graph-legend"><i></i>call<span class="line"></span>data</span></div>
    <div class="minimap" id="minimap"></div>
    <div class="dim" id="dim"></div>
    <div class="palette-wrap" id="palette-wrap">
      <div class="command-palette">
        <div class="command-input">⌕ <input id="palette-input" autofocus placeholder="Search symbols, files, views, and commands…"><span class="kbd">esc</span></div>
        <div class="command-body" id="command-body">
          <div class="command-group" data-group>
            <div class="command-group-title">Jump to</div>
            <button class="command-item active" data-open="checkout"><span class="ico">EP</span><span class="label"><b>CheckoutController.checkout</b><span>src/http/CheckoutController.ts</span></span><span class="hint">entry · reach 1.8k</span></button>
            <button class="command-item" data-open="createOrder"><span class="ico">fn</span><span class="label"><b>OrderService.createOrder</b><span>src/domain/OrderService.ts</span></span><span class="hint">hotspot</span></button>
            <button class="command-item" data-open="priceCart"><span class="ico">fn</span><span class="label"><b>PricingService.priceCart</b><span>src/domain/PricingService.ts</span></span><span class="hint">cycle</span></button>
            <button class="command-item" data-open="webhook"><span class="ico">EP</span><span class="label"><b>PaymentWebhook.handle</b><span>src/payments/PaymentWebhook.ts</span></span><span class="hint">entry · reach 922</span></button>
          </div>
          <div class="command-group" data-group>
            <div class="command-group-title">Actions</div>
            <button class="command-item"><span class="ico">◈</span><span class="label"><b>Show blast radius</b><span>Reverse the focused node</span></span><span class="hint">B</span></button>
            <button class="command-item"><span class="ico">⌁</span><span class="label"><b>Focus 2-hop neighborhood</b><span>Keep selected and two levels around it</span></span><span class="hint">F</span></button>
            <button class="command-item"><span class="ico">▤</span><span class="label"><b>Open containing file</b><span>src/http/CheckoutController.ts</span></span><span class="hint">↗</span></button>
            <button class="command-item"><span class="ico">⤓</span><span class="label"><b>Export current view as PNG</b><span>Uses the visible viewport</span></span><span class="hint">⇧⌘E</span></button>
          </div>
          <div class="command-group" data-group>
            <div class="command-group-title">Views</div>
            <button class="command-item"><span class="ico">↳</span><span class="label"><b>Entry points</b><span>180 nodes · layered</span></span><span class="hint">view</span></button>
            <button class="command-item"><span class="ico">◇</span><span class="label"><b>Pricing cycle</b><span>6 nodes · data edges</span></span><span class="hint">view</span></button>
            <button class="command-item"><span class="ico">▦</span><span class="label"><b>All functions</b><span>2,462 nodes · grid</span></span><span class="hint">view</span></button>
          </div>
          <div class="command-group" data-group>
            <div class="command-group-title">Filters</div>
            <button class="command-item"><span class="ico">⌕</span><span class="label"><b>Only functions and methods</b><span>Hide constants and external</span></span><span class="hint">filter</span></button>
            <button class="command-item"><span class="ico">◌</span><span class="label"><b>Hide dead code</b><span>0 unreachable functions remain</span></span><span class="hint">filter</span></button>
          </div>
        </div>
        <div class="palette-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">esc</span> close</span><span class="spacer"></span><span>⌘K anywhere</span></div>
      </div>
    </div>
    <div class="selected-preview" id="preview"><span>focused</span><b data-selected-name>checkout</b><span>·</span><span data-selected-file>src/http/CheckoutController.ts</span><span class="spacer"></span><span class="faint">esc to clear</span></div>
  </main>
</div>

<a class="proto-badge" href="index.html"><b>P14</b><span class="sep">·</span>Command palette</a>
<script src="assets/proto.js"></script>
<script>
  const graph = CG.mount(document.getElementById('demo-graph'), { layout: 'layered', selected: 'checkout', maxScale: 1 });
  CG.minimap(document.getElementById('minimap'), 'layered');
  const input = document.getElementById('palette-input');
  const wrap = document.getElementById('palette-wrap');
  const items = [...document.querySelectorAll('.command-item')];
  const groups = [...document.querySelectorAll('[data-group]')];
  let active = 0;
  function visibleItems() { return items.filter((item) => item.style.display !== 'none'); }
  function setActive(index) {
    const list = visibleItems();
    if (!list.length) return;
    active = (index + list.length) % list.length;
    items.forEach((item) => item.classList.remove('active'));
    list[active].classList.add('active');
    list[active].scrollIntoView({ block: 'nearest' });
  }
  function filter() {
    const q = input.value.trim().toLowerCase();
    items.forEach((item) => { item.style.display = !q || item.textContent.toLowerCase().includes(q) ? '' : 'none'; });
    groups.forEach((group) => {
      const any = [...group.querySelectorAll('.command-item')].some((item) => item.style.display !== 'none');
      group.style.display = any ? '' : 'none';
    });
    setActive(0);
  }
  input.addEventListener('input', filter);
  input.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown') { event.preventDefault(); setActive(active + 1); }
    if (event.key === 'ArrowUp') { event.preventDefault(); setActive(active - 1); }
    if (event.key === 'Enter') {
      const item = visibleItems()[active];
      if (item?.dataset.open) { graph.select(item.dataset.open); closePalette(); }
    }
    if (event.key === 'Escape') closePalette();
  });
  function closePalette() { wrap.classList.add('hidden'); document.getElementById('dim').classList.add('hidden'); }
  function openPalette() { wrap.classList.remove('hidden'); document.getElementById('dim').classList.remove('hidden'); input.focus(); }
  document.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); openPalette(); }
    if (event.key === 'Escape') closePalette();
  });
  items.forEach((item) => item.addEventListener('click', () => {
    if (item.dataset.open) { graph.select(item.dataset.open); closePalette(); }
  }));
  document.getElementById('dim').addEventListener('click', closePalette);
</script>
</body>
</html>
